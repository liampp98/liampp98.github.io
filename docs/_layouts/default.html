<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <a class="site-mark" href="{{ '/' | relative_url }}">Liam <span>/ Sport Science</span></a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}#work">Work</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="https://github.com/" target="_blank" rel="noopener">Code</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Built from the same infrastructure principles used across the dashboards on this site — R, React, and a preference for tools that raise the right questions rather than claim definitive answers.</p>
  </footer>
</body>
</html>
